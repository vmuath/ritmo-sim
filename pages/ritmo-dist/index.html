<script>
(function () {
  var panel = document.getElementById('boot-repair');
  var button = document.getElementById('repair-files');
  var status = document.getElementById('repair-status');
  var scope = new URL('./', location.href).href;
  var timer = setTimeout(function () { panel.hidden = false; var l = document.getElementById('launch'); if (l && l.remove) l.remove(); if (document.documentElement) document.documentElement.classList.remove('launching'); }, 15000);
  window.addEventListener('personal-hub-ready', function () { clearTimeout(timer); panel.hidden = true; });
  window.addEventListener('personal-hub-repair', function () { panel.hidden = false; });
  document.getElementById('dismiss-repair').onclick = function () { panel.hidden = true; };
  button.onclick = async function () {
    button.disabled = true;
    status.textContent = 'Checking fresh app files…';
    var abort = new AbortController();
    var deadline = setTimeout(function () { abort.abort(); }, 20000);
    try {
      var url = new URL('index.html', scope);
      url.searchParams.set('repair-check', Date.now());
      var response = await fetch(url, {cache:'no-store', signal:abort.signal});
      if (!response.ok) throw new Error('Connection failed');
      var html = await response.text();
      var doc = new DOMParser().parseFromString(html, 'text/html');
      var entry = doc.querySelector('script[type="module"][src]');
      if (!entry || !html.includes('RITMO')) throw new Error('App files unavailable');
      var asset = new URL(entry.getAttribute('src'), scope);
      if (asset.origin !== location.origin) throw new Error('Unexpected app source');
      asset.searchParams.set('repair-check', Date.now());
      var check = await fetch(asset, {cache:'no-store', signal:abort.signal});
      if (!check.ok || !(check.headers.get('content-type') || '').includes('javascript')) throw new Error('App script unavailable');
      await check.text();
      status.textContent = 'Refreshing app files. Your saved data is kept…';
      if ('serviceWorker' in navigator) {
        var registrations = await navigator.serviceWorker.getRegistrations();
        for (var registration of registrations) if (registration.scope === scope) await registration.unregister();
      }
      if ('caches' in window) {
        var names = await caches.keys();
        for (var name of names) if (name.startsWith('workbox-precache-') && name.endsWith(scope)) await caches.delete(name);
      }
      location.replace(scope);
    } catch (error) {
      status.textContent = 'Could not refresh app files. Check your connection and try again. Your diary has not been erased.';
      button.disabled = false;
    } finally { clearTimeout(deadline); }
  };
})();
