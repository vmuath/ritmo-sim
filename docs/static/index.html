<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SB static">
<title>SB static</title>
<script>
// Static variant: the status-bar setting is written in the HTML itself, like RITMO's.
// FILE is changed on the server between tests, to see whether an installed app picks up a new setting.
window.FILE = "v3 (default again in the HTML)";
window.SB = { mode: document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').content, installed: "static", stored: null, variant: "" };
</script>
<style>
  html { background: #f4f2ec; }
  body { margin: 0; font: 17px/1.35 -apple-system, system-ui, sans-serif; color: #151a19; min-height: 100vh; }
  #top { position: absolute; left: 0; right: 0; top: 0; height: 120px; background: #cfe0f5; }
  #readings { position: absolute; top: 230px; left: 20px; right: 20px; font-size: 20px; font-weight: 600; }
  #readings div { margin-bottom: 6px; }
  .row { position: absolute; left: 20px; right: 20px; display: flex; gap: 12px; }
  button { flex: 1; font: inherit; font-weight: 600; padding: 14px; border: 0; border-radius: 14px; background: #151a19; color: #fff; }
  #dim { position: fixed; inset: 0; background: #00000055; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 5; }
  #dim.on { opacity: 1; }
  #probe { position: fixed; top: 0; left: 0; width: 1px; height: 1px; visibility: hidden; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
</style>
</head>
<body>
<div id="top"></div>
<div id="readings"></div>
<div class="row" style="top:520px"><button id="dimBtn" aria-label="Dim">Dim</button></div>
<div class="row" style="top:680px"><button id="darkBtn" aria-label="Dark top">Dark top</button></div>
<div class="row" style="top:600px;display:none"><button id="useBt" aria-label="Use translucent">Use translucent</button><button id="useDef" aria-label="Use default">Use default</button></div>
<div id="dim"></div>
<div id="probe"></div>
<script>
function show() {
  var cs = getComputedStyle(document.getElementById("probe"));
  var L = [
    "file " + FILE,
    "meta says " + SB.mode,
    "innerHeight " + innerHeight + " / screen " + screen.height,
    "safe top " + parseFloat(cs.paddingTop) + " bottom " + parseFloat(cs.paddingBottom),
    "standalone " + (navigator.standalone === true)
  ];
  document.getElementById("readings").innerHTML = L.map(function (s) { return "<div>" + s + "</div>"; }).join("");
}
show(); setTimeout(show, 500); setTimeout(show, 1500);
document.getElementById("dimBtn").onclick = function () { document.getElementById("dim").classList.toggle("on"); };
document.getElementById("darkBtn").onclick = function () { var t = document.getElementById("top"); t.style.background = t.style.background ? "" : "#151a19"; };
document.getElementById("useBt").onclick = function () { localStorage.setItem("sb-mode", "black-translucent"); location.reload(); };
document.getElementById("useDef").onclick = function () { localStorage.setItem("sb-mode", "default"); location.reload(); };
</script>
</body>
</html>
