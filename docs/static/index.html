<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SB static">
<title>SB static</title>
<script>
// Static variant: the status-bar setting is written in the HTML itself, like RITMO's.
// v4 (19 Nov): black-translucent again, like RITMO Dev, plus four ways to dim the page, to find which one iOS
// paints behind the clock in one step and which it follows frame by frame.
window.FILE = "v4 (black-translucent, four dims)";
window.SB = { mode: document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').content };
</script>
<style>
  html { background: #f4f2ec; }
  body { margin: 0; font: 17px/1.35 -apple-system, system-ui, sans-serif; color: #151a19; min-height: 100vh; }
  #readings { position: absolute; top: 120px; left: 20px; right: 20px; font-size: 18px; font-weight: 600; }
  #readings div { margin-bottom: 4px; }
  #now { position: absolute; top: 300px; left: 20px; right: 20px; font-size: 44px; font-weight: 800; text-align: center; }
  .grid { position: absolute; left: 20px; right: 20px; top: 420px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button { font: inherit; font-weight: 600; padding: 16px 10px; border: 0; border-radius: 14px; background: #151a19; color: #fff; }
  button small { display: block; font-weight: 400; opacity: .7; font-size: 13px; }
  /* 1 and 2: a plain element over the page, always there. */
  .dim { position: fixed; inset: 0; background: #00000055; pointer-events: none; z-index: 5; }
  #d1 { opacity: 0; transition: opacity 220ms ease-out; }
  #d1.on { opacity: 1; }
  #d2 { filter: opacity(0); transition: filter 220ms ease-out; }
  #d2.on { filter: opacity(1); }
  /* 3 and 4: a modal dialog (a light sheet at the bottom) with its backdrop, as RITMO's dock. */
  dialog { margin: auto 0 0; width: 100%; max-width: none; height: 45vh; border: 0; border-radius: 26px 26px 0 0; padding: 24px; box-sizing: border-box; background: #f4f2ec; }
  dialog::backdrop { background: #00000055; }
  #s3::backdrop { animation: b3in 220ms ease-out; }
  #s3.closing::backdrop { animation: b3out 180ms ease-in forwards; }
  @keyframes b3in { from { opacity: 0; } }
  @keyframes b3out { to { opacity: 0; } }
  #s4::backdrop { animation: b4in 220ms ease-out; }
  #s4.closing::backdrop { animation: b4out 180ms ease-in forwards; }
  @keyframes b4in { from { filter: opacity(0); } }
  @keyframes b4out { to { filter: opacity(0); } }
  #probe { position: fixed; top: 0; left: 0; width: 1px; height: 1px; visibility: hidden; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
</style>
</head>
<body>
<div id="readings"></div>
<div id="now">Tap 1, 2, 3, 4</div>
<div class="grid">
  <button id="b1" aria-label="Dim 1">1<small>plain, opacity</small></button>
  <button id="b2" aria-label="Dim 2">2<small>plain, filter</small></button>
  <button id="b3" aria-label="Dim 3">3<small>sheet, opacity</small></button>
  <button id="b4" aria-label="Dim 4">4<small>sheet, filter (RITMO)</small></button>
</div>
<div id="d1" class="dim"></div>
<div id="d2" class="dim"></div>
<dialog id="s3"><b>Sheet 3</b></dialog>
<dialog id="s4"><b>Sheet 4</b></dialog>
<div id="probe"></div>
<script>
function show() {
  var cs = getComputedStyle(document.getElementById("probe"));
  var L = [
    "file " + FILE,
    "meta says " + SB.mode,
    "innerHeight " + innerHeight + " / screen " + screen.height,
    "safe top " + parseFloat(cs.paddingTop) + " bottom " + parseFloat(cs.paddingBottom)
  ];
  document.getElementById("readings").innerHTML = L.map(function (s) { return "<div>" + s + "</div>"; }).join("");
}
show(); setTimeout(show, 500); setTimeout(show, 1500);
var busy = false, now = document.getElementById("now");
function run(n, on, off) { if (busy) return; busy = true; now.textContent = "Now: " + n; on(); setTimeout(function () { off(); setTimeout(function () { now.textContent = "Done: " + n; busy = false; }, 400); }, 1600); }
function plain(id) { var d = document.getElementById(id); return [function () { d.classList.add("on"); }, function () { d.classList.remove("on"); }]; }
function sheet(id) { var s = document.getElementById(id); return [function () { s.showModal(); }, function () { s.classList.add("closing"); setTimeout(function () { s.close(); s.classList.remove("closing"); }, 180); }]; }
[["b1", plain("d1")], ["b2", plain("d2")], ["b3", sheet("s3")], ["b4", sheet("s4")]].forEach(function (x, i) {
  document.getElementById(x[0]).onclick = function () { run(i + 1, x[1][0], x[1][1]); };
});
</script>
</body>
</html>
