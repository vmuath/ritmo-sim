# Runs RITMO Dev (https://preview.ritmoapp.pages.dev) as a Home Screen web app on a simulated
# iPhone 16 Pro, drives it with XCUITest touches and records the screen. Public repo: the macOS
# runner is free. This repo holds test scripts only — no app code, no personal data.
name: Probe

on:
  workflow_dispatch:
    inputs:
      url:
        description: Page to test
        default: https://preview.ritmoapp.pages.dev/
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      PROBE_URL: ${{ inputs.url || 'https://preview.ritmoapp.pages.dev/' }}
    steps:
      - uses: actions/checkout@v4

      - name: Tools and simulator runtimes
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devicetypes | grep -i "iphone 1[67]" || true
          brew install xcodegen >/dev/null

      - name: Create and boot an iPhone 16 Pro
        run: |
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "
          import json,sys
          r=[x for x in json.load(sys.stdin)['runtimes'] if x['platform']=='iOS' and x['isAvailable'] and 'iPhone' not in x['identifier']]
          r.sort(key=lambda x:[int(p) for p in x['version'].split('.')])
          print(r[-1]['identifier'])")
          TYPE=com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro
          xcrun simctl list devicetypes | grep -q "iPhone 16 Pro (" || TYPE=com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro
          UDID=$(xcrun simctl create probe "$TYPE" "$RUNTIME")
          echo "UDID=$UDID" >> $GITHUB_ENV
          echo "runtime $RUNTIME type $TYPE udid $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          sleep 20

      - name: Build the test project
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild build-for-testing -project Probe.xcodeproj -scheme Probe \
            -destination "id=$UDID" -derivedDataPath dd CODE_SIGN_IDENTITY=- | tail -5

      - name: Record the screen while the probe runs
        continue-on-error: true
        run: |
          mkdir -p out
          xcrun simctl io "$UDID" recordVideo --codec=h264 --force out/probe.mp4 &
          REC=$!
          python3 -c "import time;print('%.3f'%time.time())" > out/video-start.txt
          sleep 2
          set +e
          xcodebuild test-without-building -project Probe.xcodeproj -scheme Probe \
            -destination "id=$UDID" -derivedDataPath dd -resultBundlePath out/probe.xcresult \
            TEST_RUNNER_PROBE_URL="$PROBE_URL" 2>&1 | grep -E "PROBE|error|passed|failed|Test Case" | tee out/test-log.txt
          kill -INT $REC; wait $REC
          echo done

      - name: Export screenshots and trees
        if: always()
        run: |
          mkdir -p out/steps
          xcrun xcresulttool export attachments --path out/probe.xcresult --output-path out/steps || true
          ls -la out out/steps | head -80

      # Results go to a branch (results/<run id>): Claude's workspace can fetch git but not artifact storage.
      - name: Publish results to a branch
        if: always()
        run: |
          B=results/${{ github.run_id }}
          rm -rf /tmp/r && mkdir -p /tmp/r && cp -R out/steps out/*.txt out/*.mp4 /tmp/r/ 2>/dev/null || true
          cd /tmp/r && git init -q -b "$B" && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm "Probe results ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "$B"
          echo "published $B"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe
          path: |
            out/*.mp4
            out/*.txt
            out/steps
          retention-days: 14
